name: model-training

on:
  pull_request:
    branches: main

permissions: write-all

jobs:
  train_and_report_eval_performance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.9

      # ✅ Installer DVC correctement
      - name: Setup DVC
        uses: iterative/setup-dvc@v2

      # ✅ Installer CML pour la génération de rapport
      - name: Setup CML
        uses: iterative/setup-cml@v2

      # (Optionnel mais recommandé)
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train model
        run: |
          python3 preprocess_dataset.py
          python3 train.py

      - name: Write CML report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Créer un rapport Markdown avec les métriques
          echo "## Résultats du modèle" > model_eval_report.md
          echo "" >> model_eval_report.md
          cat metrics.json >> model_eval_report.md
          echo "" >> model_eval_report.md
          echo "### Matrice de confusion" >> model_eval_report.md
          echo "![Confusion Matrix](./confusion_matrix.png)" >> model_eval_report.md

          # Publier un commentaire automatique sur la Pull Request
          cml comment create model_eval_report.md
